name: Build Libbox for iOS 12

on:
  workflow_dispatch:
    inputs:
      singbox_ref:
        description: 'Ветка/тег/commit sing-box'
        required: true
        default: 'v1.11.11'
      ios_version:
        description: 'Минимальная версия iOS'
        required: true
        default: '12.0'
      build_tags:
        description: 'Build tags'
        required: true
        default: 'with_gvisor with_quic with_utls with_low_memory'
      go_version:
        description: 'Версия Go'
        required: true
        default: '1.20.14'

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.singbox_ref }}
          path: sing-box

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ github.event.inputs.go_version }}
          cache: false

      - name: Show environment
        run: |
          xcodebuild -version
          go version
          sw_vers

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Init gomobile
        run: gomobile init

      - name: Build Libbox.xcframework
        working-directory: sing-box/experimental/libbox
        run: |
          gomobile bind \
            -target=ios \
            -iosversion=${{ github.event.inputs.ios_version }} \
            -tags "${{ github.event.inputs.build_tags }}" \
            -o $GITHUB_WORKSPACE/Libbox.xcframework \
            .

      - name: Inspect result
        run: |
          ls -lah $GITHUB_WORKSPACE/Libbox.xcframework
          file $GITHUB_WORKSPACE/Libbox.xcframework/ios-arm64/Libbox.framework/Libbox

      - name: Package as zip
        run: |
          cd $GITHUB_WORKSPACE
          zip -r Libbox.xcframework.zip Libbox.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Libbox-ios12-xcframework
          path: Libbox.xcframework.zip
          retention-days: 30
